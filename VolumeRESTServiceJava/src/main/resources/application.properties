server.port=54808
logging.level.root=WARN
logging.level.com.medicaljava=INFO

# Directory of per-patient DICOM folders (patient/series/*.dcm) that is imported into the store. If this
# path doesn't exist, the importer falls back to ../Data so it also works when run from VolumeRESTServiceJava/.
app.data-dir=/home/antony/src/MedicalJava/Data

# Volume store: SQLite metadata (store.db) plus one raw int16 pixel file per volume (volumes/*.vol).
app.store-dir=/home/antony/src/MedicalJava/Store
# Import new or changed series from app.data-dir in the background at startup. Also available as POST /api/import.
app.import-on-startup=true

# Uploads (POST /api/Volumes, POST /api/Patients/{id}/Volumes) accept DICOM files and zip archives.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
app.upload.max-extracted-size=4GB

spring.threads.virtual.enabled=true

# Automatic segmentation runs on an external worker (SegmentationWorker/worker.py); jobs wait this long for a result.
app.segmentation.worker-url=http://localhost:54809
app.segmentation.worker-timeout=4h
